on:
  push:
  pull_request:
    types: [opened, synchronize]
jobs:
  build:
    runs-on: ubuntu-latest
    name: script/cibuild
    steps:
      - uses: actions/checkout@v2
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2
          bundler-cache: true
      - name: build
        run: script/bootstrap
      - name: test
        run: script/cibuild
        env:
          # The end-to-end browser test must actually run on CI (it uses the
          # runner's preinstalled Chrome); fail loudly instead of skipping.
          NCA_E2E_REQUIRED: "1"
