<!-- NoCookieAnalytics (always loads, cookieless, GDPR-safe) -->
<script async defer src="https://nocookieanalytics.com/latest.js"></script>

<!-- Set GA4 consent default to denied before any GA script can load -->
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag() { dataLayer.push(arguments); }
  gtag('consent', 'default', { 'analytics_storage': 'denied' });
</script>

<script>
  {% if site.debug %}
  function debugLog(...args) {
    console.log("DEBUG:", ...args);
  }
  {% else %}
  function debugLog() {
    // No-op in production
  }
  {% endif %}

  function send_nca_event(...args) {
    debugLog("Sending NCA event:", ...args);
    if (typeof nca_event === 'function') {
      nca_event(...args);
    }
  }

  function send_gtag(...args) {
    debugLog("Sending gtag:", ...args);
    if (typeof gtag === 'function') {
      gtag(...args);
    }
  }

  function disableGA() {
    // Stop any further Google Analytics requests
    window['ga-disable-G-3T5JF88VB0'] = true;
    send_gtag('consent', 'update', { 'analytics_storage': 'denied' });
  }

  // Load Google Analytics only after explicit consent
  function loadGA() {
    debugLog("Loading Google Analytics...");
    if (window.gaLoaded) return;
    window.gaLoaded = true;

    const s = document.createElement("script");
    s.src = "https://www.googletagmanager.com/gtag/js?id=G-3T5JF88VB0";
    s.async = true;
    document.head.appendChild(s);

    send_gtag('js', new Date());
    send_gtag('config', 'G-3T5JF88VB0');
    send_gtag('consent', 'update', { 'analytics_storage': 'granted' });
  }
</script>

<script>
  // Visitor classification: a standalone function (window.classifyVisitor)
  // so the test suite can drive it directly against real crawler corpora.
  // Purely UA + webdriver flag based - no fingerprinting or personal data.
  // Each known bot maps to [display name, category]; anything the curated
  // list misses falls through to a coverage net vendored from the isbot
  // project (catches ~1500 crawler families), then to generic tokens.
  window.classifyVisitor = (function () {
    const knownBots = {
      // Search engines & crawlers
      googlebot: ["Googlebot", "search"],
      bingbot: ["Bingbot", "search"],
      duckduckbot: ["DuckDuckBot", "search"],
      baiduspider: ["Baiduspider", "search"],
      yandexbot: ["YandexBot", "search"],
      sogou: ["Sogou", "search"],
      seznambot: ["SeznamBot", "search"],
      yisou: ["YisouSpider", "search"],
      petalbot: ["PetalBot", "search"],
      exabot: ["Exabot", "search"],
      applebot: ["Applebot", "search"],
      bingpreview: ["BingPreview", "search"],
      slurp: ["YahooSlurp", "search"],
      yeti: ["Yeti", "search"],
      voilabot: ["VoilaBot", "search"],
      nutch: ["Nutch", "search"],
      qwantify: ["Qwantify", "search"],
      robozilla: ["Robozilla", "search"],
      "mail.ru": ["MailRuBot", "search"],
      "feedfetcher-google": ["GoogleFeedFetcher", "search"],
      "duckduckgo-favicons": ["DuckDuckGo", "search"],
      "mediapartners-google": ["GoogleAdSense", "search"],
      "adsbot-google": ["GoogleAdsBot", "search"],
      "storebot-google": ["GoogleStoreBot", "search"],
      "apis-google": ["GoogleAPIs", "search"],
      ia_archiver: ["ArchiveBot", "archive"],
      // AI / ML crawlers
      gptbot: ["GPTBot", "ai"],
      claude: ["ClaudeBot", "ai"],
      "anthropic-ai": ["Anthropic", "ai"],
      ccbot: ["CCBot", "ai"],
      perplexitybot: ["PerplexityBot", "ai"],
      bytespider: ["Bytespider", "ai"],
      amazonbot: ["Amazonbot", "ai"],
      cohere: ["Cohere", "ai"],
      omgili: ["OmgiliBot", "ai"],
      diffbot: ["Diffbot", "ai"],
      youbot: ["YouBot", "ai"],
      andisearch: ["AndiSearch", "ai"],
      // SEO / audit / link checkers. Real-engine renderers (Lighthouse,
      // PageSpeed Insights, Search Console inspection, ...) ship a clean
      // browser UA but run automated pages.
      semrushbot: ["SemrushBot", "seo"],
      ahrefsbot: ["AhrefsBot", "seo"],
      dotbot: ["DotBot", "seo"],
      screaming: ["ScreamingFrog", "seo"],
      xenu: ["Xenu", "seo"],
      "chrome-lighthouse": ["Lighthouse", "seo"],
      "google-inspectiontool": ["GoogleInspectionTool", "seo"],
      "googlepagespeedinsights": ["PageSpeedInsights", "seo"],
      mj12bot: ["MJ12bot", "seo"],
      blexbot: ["BLEXBot", "seo"],
      seokicks: ["SeoKicks", "seo"],
      admantx: ["Admantx", "seo"],
      "w3c_validator": ["W3CValidator", "seo"],
      "validator.nu": ["ValidatorNu", "seo"],
      gtmetrix: ["GTmetrix", "seo"],
      // Uptime monitors
      uptimerobot: ["UptimeRobot", "uptime"],
      "site24x7": ["Site24x7", "uptime"],
      pingdom: ["Pingdom", "uptime"],
      statuscake: ["StatusCake", "uptime"],
      monitis: ["Monitis", "uptime"],
      moneypenny: ["MoneyPenny", "uptime"],
      newrelic: ["NewRelicPinger", "uptime"],
      // Social / chat prefetchers
      facebookexternalhit: ["Facebook", "social"],
      facebot: ["Facebook", "social"],
      twitterbot: ["Twitter", "social"],
      linkedinbot: ["LinkedIn", "social"],
      slackbot: ["Slack", "social"],
      discordbot: ["Discord", "social"],
      telegrambot: ["Telegram", "social"],
      "line-pf": ["LINE", "social"],
      pinterestbot: ["PinterestBot", "social"],
      skypeuripreview: ["Skype", "social"],
      snapchat: ["Snapchat", "social"],
      viber: ["Viber", "social"],
      outbrain: ["Outbrain", "social"],
      taboola: ["Taboola", "social"],
      flipboardproxy: ["Flipboard", "social"],
      tumblr: ["Tumblr", "social"],
      // Headless / browser automation
      headlesschrome: ["HeadlessChrome", "automation"],
      phantomjs: ["PhantomJS", "automation"],
      slimerjs: ["SlimerJS", "automation"],
      puppeteer: ["Puppeteer", "automation"],
      playwright: ["Playwright", "automation"],
      selenium: ["Selenium", "automation"],
      // CLI / HTTP clients
      "python-requests": ["Python-Requests", "cli"],
      curl: ["curl", "cli"],
      wget: ["Wget", "cli"],
      okhttp: ["OkHttp", "cli"],
      "java/": ["Java", "cli"],
      "go-http-client": ["Go-http-client", "cli"],
      postmanruntime: ["Postman", "cli"],
      insomnia: ["Insomnia", "cli"],
      preflight: ["Preflight", "cli"]
    };
    // Coverage net: the isbot project compiled pattern (vendored snapshot).
    // Built with new RegExp() because the source contains "/" literals, and
    // guarded with try/catch for browsers without lookbehind support (there
    // it degrades to the curated list above).
    const ISBOT_PATTERN = " daum[ /]| deusu\\/|(?:^|[^g])news(?!sapphire)|(?<! channel\\/|google\\/)google(?!(?:wv|app|\\/google| pixel))|(?<! cu)bots?(?:\\b|_)|(?<!cam)scan|(?<!lib)http|24x7|;\\s\\w+;$|@[a-z][\\w-]+\\.|\\(\\)|\\.com\\b|\\b\\w+\\.ai|\\bbw\\/|\\bdlc\\b|\\bort\\/|\\bperl\\b|\\btime\\/|\\||^[<\\(;]|^[\\w \\.\\-\\(?:\\):%]+(?:\\/v?\\d+(?:\\.\\d+)?(?:\\.\\d{1,10})*?)?(?:,|$)|^[\\w\\-]+\\/[\\w]+$|^[^ ]{50,}$|^\\d+\\b|^\\w*search\\b|^\\w+\\/[\\w\\(\\)]*$|^\\w+\\/\\d\\.\\d\\s\\([\\w@]+\\)$|^active|^ad muncher|^amaya|^apache\\/|^avsdevicesdk\\/|^azure|^biglotron|^blackbox exporter|^bot|^clamav[ /]|^claude-code\\/|^client\\/|^cobweb\\/|^custom|^ddg[_-]android|^discourse|^dispatch\\/\\d|^downcast\\/|^duckduckgo|^email|^exodusmovement|^facebook|^getright\\/|^gozilla\\/|^hobbit|^hotzonu|^hwcdn\\/|^igetter\\/|^jeode\\/|^jetty\\/|^jigsaw|^microsoft bits|^movabletype|^mozilla\\/\\d\\.\\d\\s[\\w\\.-]+$|^mozilla\\/\\d\\.\\d\\s\\((?:compatible;)?(?:\\s?[\\w\\d-.]+\\/\\d+\\.\\d+)?\\)$|^navermailapp|^netsurf|^offline|^openai\\/|^owler|^php|^postman|^ps_daily\\/|^python|^rank|^read|^reed|^remove\\.bg\\/|^rest|^rss|^snapchat|^sora |^space bison|^stape\\/|^svn|^swcd |^taringa|^thumbor\\/|^track|^w3c|^webbandit\\/|^webcopier|^wget|^whatsapp|^wordpress|^xenu link sleuth|^yahoo|^yandex|^zdm\\/\\d|^zoom marketplace\\/|abuse|advisor|agent\\b|analyzer|archive|ask jeeves\\/teoma|attracta|audit|bluecoat drtr|browsex|burpcollaborator|capture|catch|check\\b|checker|chrome-lighthouse|chromeframe|classifier|cloudflare|collapsify\\b|convertify|cookiehubverify\\/|crawl|cursor\\/|cypress\\/|dareboost|datanyze|dejaclick|detect|discovery|dmbrowser|download|exaleadcloudview|feed|fetcher|firephp|foregenix|functionize|grab|hardenize\\b|headless|hotjar|httrack|hubspot marketing grader|ibisbrowser|infrawatch|insight|inspect|iplabel|java(?!;)|library|linkcheck|linktiger|mail\\.ru\\/|manager|manus-user\\/|marketgoo\\/|measure|monitor\\b|neustar wpm|node\\b|nutch|offbyone|openvas|optimize|pageburst|pagespeed|parser|phantomjs|pingdom|playwright|powermarks|preview|productfinder|prospectingstudio|proxy|ptst[ /]\\d|radar|readable\\/|retriever|rexx;|rigor|rss\\b|scrape|securityheaders|selenium|server|silktide|sindup\\/|sogou|sparkler\\/|speedcurve|spider|splash|statuscake|supercleaner|synapse|synthetic|testlocally|tools|torrent|transcoder|upday\\/|url|validator|virtuoso|wappalyzer|watchtowr|webglance|webkit2png|whatcms\\/|xtate\\/";
    let isbotPattern = null;
    try { isbotPattern = new RegExp(ISBOT_PATTERN, "i"); } catch (e) {}
    // Generic tokens for crawling behavior not covered by a specific entry
    const genericBotTokens = ["bot", "crawler", "spider", "scrape", "headless", "renderer", "aiohttp", "httpx", "node-fetch", "httpclient"];

    return function classifyVisitor(uaRaw, webdriver) {
      const ua = (uaRaw || "").toLowerCase();
      for (const token in knownBots) {
        if (ua.includes(token)) return { name: knownBots[token][0], category: knownBots[token][1] };
      }
      if (isbotPattern && isbotPattern.test(ua)) return { name: "Unknown", category: "other" };
      if (genericBotTokens.some(t => ua.includes(t))) return { name: "Unknown", category: "other" };
      if (webdriver) return { name: "Headless", category: "automation" };
      return { name: "human", category: null };
    };
  })();
</script>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const consentKey = "ga_consent";
    const banner = document.getElementById("cookie-consent");
    // localStorage can throw in sandboxed/private contexts; a failure here
    // must not break the rest of the tracking logic.
    const safeStorageGet = (key) => {
      try { return window.localStorage.getItem(key); } catch (e) { return null; }
    };
    const safeStorageSet = (key, value) => {
      try { window.localStorage.setItem(key, value); } catch (e) {}
    };
    const safeStorageRemove = (key) => {
      try { window.localStorage.removeItem(key); } catch (e) {}
    };
    const consent = safeStorageGet(consentKey);
    const acceptBtn = document.getElementById("accept-cookies");
    const rejectBtn = document.getElementById("reject-cookies");
    const withdrawBtn = document.getElementById("withdraw-consent");

    // Show banner only if no decision has been made yet. Returning visitors
    // must have their previous decision re-applied on every page load: a
    // "granted" visitor reloads GA, a "denied" one keeps GA disabled.
    if (!consent) {
      banner.style.display = "block";
    } else if (consent === "granted") {
      loadGA();
    } else if (consent === "denied") {
      disableGA();
    }
    debugLog("GA consent status:", consent);

    // Track link and summary clicks
    document.addEventListener('click', event => {
      if (!(event.target instanceof Element)) return;
      const link = event.target.closest('a, summary');
      if (!link) return;
      const eventName = link.dataset.event || 'click';
      const text = eventName + '.' + link.textContent.trim().replace(/\s+/g, '-');
      send_nca_event(text);
    });

    // Anonymous engagement events (no personal data; consistent with the
    // privacy policy):
    //  - scroll depth: report the deepest milestone reached (25/50/75/100%)
    //  - time on page: one "engaged.30s" heartbeat after 30 seconds
    // "engaged" means a strong, human-like signal: a real click/tap/keypress,
    // or scrolling at least 25% of the page. Weak signals (a stray mousemove,
    // a sub-25% nudge) do not count - automated crawlers that only brush the
    // page must not be classified as active.
    let engaged = false;
    const engagement = {
      maxDepth: 0,
      reported: {},
      onScroll() {
        const doc = document.documentElement;
        const maxScroll = doc.scrollHeight - doc.clientHeight;
        if (maxScroll <= 0) return;
        this.maxDepth = Math.max(this.maxDepth, Math.round((doc.scrollTop / maxScroll) * 100));
        if (this.maxDepth >= 25) engaged = true;
        [25, 50, 75, 100].forEach(t => {
          if (this.maxDepth >= t && !this.reported[t]) {
            this.reported[t] = true;
            send_nca_event('scroll-depth.' + t);
          }
        });
      }
    };

    // Throttle scroll handling to at most once per 300ms
    let lastScroll = 0;
    let scrollTimer = null;
    window.addEventListener('scroll', () => {
      const now = Date.now();
      if (now - lastScroll >= 300) {
        lastScroll = now;
        engagement.onScroll();
      } else if (!scrollTimer) {
        scrollTimer = setTimeout(() => {
          lastScroll = Date.now();
          scrollTimer = null;
          engagement.onScroll();
        }, 300);
      }
    }, { passive: true });
    engagement.onScroll();

    // Classify the visitor as a bot/crawler or a human with the standalone
    // window.classifyVisitor (UA + webdriver flag only - no fingerprinting
    // or personal data). Runs before the engagement timers so bots are
    // excluded from "engaged"/"visit" events.
    const ua = (navigator.userAgent || '').toLowerCase();
    const classification = window.classifyVisitor(navigator.userAgent, navigator.webdriver);
    const isBot = classification.name !== "human";
    if (isBot) {
      // Payload: category + raw user-agent (truncated) for richer segmentation
      send_nca_event('visitor.bot.' + classification.name, classification.category + '|' + ua.slice(0, 120));
    } else {
      send_nca_event('visitor.human');
    }

    // Report 30s of engagement (single fire; not tied to consent decision).
    // Bots/crawlers and passive loads are excluded - only visitors with a
    // strong engagement signal get a 30s heartbeat.
    setTimeout(() => {
      if (!isBot && engaged) send_nca_event('engaged.30s');
    }, 30000);

    // Interaction heuristic: after 6s, report whether any strong, human-like
    // interaction was observed. A real mouse movement, click/tap, keypress,
    // or scrolling at least 25% of the page (see engagement.onScroll) counts;
    // a sub-25% scroll nudge does not. Separates passive loads (fast bots,
    // bounces) from engaged visits.
    ['pointerdown', 'keydown', 'click', 'mousemove'].forEach(evt =>
      window.addEventListener(evt, () => { engaged = true; }, { passive: true, once: true })
    );
    setTimeout(() => {
      if (!isBot) send_nca_event(engaged ? 'visit.active' : 'visit.passive');
    }, 6000);

    if (acceptBtn) {
      acceptBtn.addEventListener("click", event => {
        event.preventDefault();
        safeStorageSet(consentKey, "granted");
        banner.style.display = "none";
        send_nca_event("cookie-consent-accepted");
        loadGA();
      });
    }

    if (rejectBtn) {
      rejectBtn.addEventListener("click", event => {
        event.preventDefault();
        safeStorageSet(consentKey, "denied");
        banner.style.display = "none";
        send_nca_event("cookie-consent-rejected");
        disableGA();
      });
    }

    if (withdrawBtn) {
      withdrawBtn.addEventListener("click", event => {
        event.preventDefault();
        disableGA();
        safeStorageRemove(consentKey);
        banner.style.display = "block";
        send_nca_event("cookie-consent-withdrawn");
        debugLog("GA consent withdrawn by user.");
      });
    }
  });
</script>
