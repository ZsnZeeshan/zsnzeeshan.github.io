<!-- NoCookieAnalytics (always loads, cookieless, GDPR-safe) -->
<script async defer src="https://nocookieanalytics.com/latest.js"></script>

<!-- Set GA4 consent default to denied before any GA script can load -->
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag() { dataLayer.push(arguments); }
  gtag('consent', 'default', { 'analytics_storage': 'denied' });
</script>

<script>
  {% if site.debug %}
  function debugLog(...args) {
    console.log("DEBUG:", ...args);
  }
  {% else %}
  function debugLog() {
    // No-op in production
  }
  {% endif %}

  function send_nca_event(...args) {
    debugLog("Sending NCA event:", ...args);
    if (typeof nca_event === 'function') {
      nca_event(...args);
    }
  }

  function send_gtag(...args) {
    debugLog("Sending gtag:", ...args);
    if (typeof gtag === 'function') {
      gtag(...args);
    }
  }

  function disableGA() {
    // Stop any further Google Analytics requests
    window['ga-disable-G-3T5JF88VB0'] = true;
    send_gtag('consent', 'update', { 'analytics_storage': 'denied' });
  }

  // Load Google Analytics only after explicit consent
  function loadGA() {
    debugLog("Loading Google Analytics...");
    if (window.gaLoaded) return;
    window.gaLoaded = true;

    const s = document.createElement("script");
    s.src = "https://www.googletagmanager.com/gtag/js?id=G-3T5JF88VB0";
    s.async = true;
    document.head.appendChild(s);

    send_gtag('js', new Date());
    send_gtag('config', 'G-3T5JF88VB0');
    send_gtag('consent', 'update', { 'analytics_storage': 'granted' });
  }
</script>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const consentKey = "ga_consent";
    const banner = document.getElementById("cookie-consent");
    // localStorage can throw in sandboxed/private contexts; a failure here
    // must not break the rest of the tracking logic.
    const safeStorageGet = (key) => {
      try { return window.localStorage.getItem(key); } catch (e) { return null; }
    };
    const safeStorageSet = (key, value) => {
      try { window.localStorage.setItem(key, value); } catch (e) {}
    };
    const safeStorageRemove = (key) => {
      try { window.localStorage.removeItem(key); } catch (e) {}
    };
    const consent = safeStorageGet(consentKey);
    const acceptBtn = document.getElementById("accept-cookies");
    const rejectBtn = document.getElementById("reject-cookies");
    const withdrawBtn = document.getElementById("withdraw-consent");

    // Show banner only if no decision has been made yet. Returning visitors
    // must have their previous decision re-applied on every page load: a
    // "granted" visitor reloads GA, a "denied" one keeps GA disabled.
    if (!consent) {
      banner.style.display = "block";
    } else if (consent === "granted") {
      loadGA();
    } else if (consent === "denied") {
      disableGA();
    }
    debugLog("GA consent status:", consent);

    // Track link and summary clicks
    document.addEventListener('click', event => {
      if (!(event.target instanceof Element)) return;
      const link = event.target.closest('a, summary');
      if (!link) return;
      const eventName = link.dataset.event || 'click';
      const text = eventName + '.' + link.textContent.trim().replace(/\s+/g, '-');
      send_nca_event(text);
    });

    // Anonymous engagement events (no personal data; consistent with the
    // privacy policy):
    //  - scroll depth: report the deepest milestone reached (25/50/75/100%)
    //  - time on page: one "engaged.30s" heartbeat after 30 seconds
    const engagement = {
      maxDepth: 0,
      reported: {},
      onScroll() {
        const doc = document.documentElement;
        const maxScroll = doc.scrollHeight - doc.clientHeight;
        if (maxScroll <= 0) return;
        this.maxDepth = Math.max(this.maxDepth, Math.round((doc.scrollTop / maxScroll) * 100));
        [25, 50, 75, 100].forEach(t => {
          if (this.maxDepth >= t && !this.reported[t]) {
            this.reported[t] = true;
            send_nca_event('scroll-depth.' + t);
          }
        });
      }
    };

    // Throttle scroll handling to at most once per 300ms
    let lastScroll = 0;
    let scrollTimer = null;
    window.addEventListener('scroll', () => {
      const now = Date.now();
      if (now - lastScroll >= 300) {
        lastScroll = now;
        engagement.onScroll();
      } else if (!scrollTimer) {
        scrollTimer = setTimeout(() => {
          lastScroll = Date.now();
          scrollTimer = null;
          engagement.onScroll();
        }, 300);
      }
    }, { passive: true });
    engagement.onScroll();

    // Classify the visitor as a bot/crawler or a human, using the user-agent
    // string (already collected by NCA) plus the webdriver flag. Purely
    // anonymous - no fingerprinting or personal data. Runs before the
    // engagement timers so bots can be excluded from "engaged"/"visit" events.
    // Each known bot maps to [display name, category].
    const ua = (navigator.userAgent || '').toLowerCase();
    const knownBots = {
      // Search engines & crawlers
      googlebot: ['Googlebot', 'search'],
      bingbot: ['Bingbot', 'search'],
      duckduckbot: ['DuckDuckBot', 'search'],
      baiduspider: ['Baiduspider', 'search'],
      yandexbot: ['YandexBot', 'search'],
      sogou: ['Sogou', 'search'],
      seznambot: ['SeznamBot', 'search'],
      yisou: ['YisouSpider', 'search'],
      petalbot: ['PetalBot', 'search'],
      exabot: ['Exabot', 'search'],
      applebot: ['Applebot', 'search'],
      bingpreview: ['BingPreview', 'search'],
      slurp: ['YahooSlurp', 'search'],
      yeti: ['Yeti', 'search'],
      voilabot: ['VoilaBot', 'search'],
      nutch: ['Nutch', 'search'],
      qwantify: ['Qwantify', 'search'],
      robozilla: ['Robozilla', 'search'],
      'mail.ru': ['MailRuBot', 'search'],
      'feedfetcher-google': ['GoogleFeedFetcher', 'search'],
      'duckduckgo-favicons': ['DuckDuckGo', 'search'],
      'mediapartners-google': ['GoogleAdSense', 'search'],
      'adsbot-google': ['GoogleAdsBot', 'search'],
      'storebot-google': ['GoogleStoreBot', 'search'],
      'apis-google': ['GoogleAPIs', 'search'],
      ia_archiver: ['ArchiveBot', 'archive'],
      // AI / ML crawlers
      gptbot: ['GPTBot', 'ai'],
      claude: ['ClaudeBot', 'ai'],
      'anthropic-ai': ['Anthropic', 'ai'],
      ccbot: ['CCBot', 'ai'],
      perplexitybot: ['PerplexityBot', 'ai'],
      bytespider: ['Bytespider', 'ai'],
      amazonbot: ['Amazonbot', 'ai'],
      cohere: ['Cohere', 'ai'],
      omgili: ['OmgiliBot', 'ai'],
      diffbot: ['Diffbot', 'ai'],
      youbot: ['YouBot', 'ai'],
      andisearch: ['AndiSearch', 'ai'],
      // SEO / audit / link checkers. Real-engine renderers (Lighthouse,
      // PageSpeed Insights, Search Console's inspection tool, ...) ship a
      // clean browser UA but run automated pages - they scroll programmatically
      // and would otherwise pollute visit.active.
      semrushbot: ['SemrushBot', 'seo'],
      ahrefsbot: ['AhrefsBot', 'seo'],
      dotbot: ['DotBot', 'seo'],
      screaming: ['ScreamingFrog', 'seo'],
      xenu: ['Xenu', 'seo'],
      'chrome-lighthouse': ['Lighthouse', 'seo'],
      'google-inspectiontool': ['GoogleInspectionTool', 'seo'],
      'googlepagespeedinsights': ['PageSpeedInsights', 'seo'],
      mj12bot: ['MJ12bot', 'seo'],
      blexbot: ['BLEXBot', 'seo'],
      seokicks: ['SeoKicks', 'seo'],
      admantx: ['Admantx', 'seo'],
      'w3c_validator': ['W3CValidator', 'seo'],
      'validator.nu': ['ValidatorNu', 'seo'],
      gtmetrix: ['GTmetrix', 'seo'],
      // Uptime monitors
      uptimerobot: ['UptimeRobot', 'uptime'],
      'site24x7': ['Site24x7', 'uptime'],
      pingdom: ['Pingdom', 'uptime'],
      statuscake: ['StatusCake', 'uptime'],
      monitis: ['Monitis', 'uptime'],
      moneypenny: ['MoneyPenny', 'uptime'],
      newrelic: ['NewRelicPinger', 'uptime'],
      // Social / chat prefetchers
      facebookexternalhit: ['Facebook', 'social'],
      facebot: ['Facebook', 'social'],
      twitterbot: ['Twitter', 'social'],
      linkedinbot: ['LinkedIn', 'social'],
      slackbot: ['Slack', 'social'],
      discordbot: ['Discord', 'social'],
      telegrambot: ['Telegram', 'social'],
      'line-pf': ['LINE', 'social'],
      pinterestbot: ['PinterestBot', 'social'],
      skypeuripreview: ['Skype', 'social'],
      snapchat: ['Snapchat', 'social'],
      viber: ['Viber', 'social'],
      outbrain: ['Outbrain', 'social'],
      taboola: ['Taboola', 'social'],
      flipboardproxy: ['Flipboard', 'social'],
      tumblr: ['Tumblr', 'social'],
      // Headless / browser automation
      headlesschrome: ['HeadlessChrome', 'automation'],
      phantomjs: ['PhantomJS', 'automation'],
      slimerjs: ['SlimerJS', 'automation'],
      puppeteer: ['Puppeteer', 'automation'],
      playwright: ['Playwright', 'automation'],
      selenium: ['Selenium', 'automation'],
      // CLI / HTTP clients
      'python-requests': ['Python-Requests', 'cli'],
      curl: ['curl', 'cli'],
      wget: ['Wget', 'cli'],
      okhttp: ['OkHttp', 'cli'],
      'java/': ['Java', 'cli'],
      'go-http-client': ['Go-http-client', 'cli'],
      postmanruntime: ['Postman', 'cli'],
      insomnia: ['Insomnia', 'cli'],
      preflight: ['Preflight', 'cli']
    };
    // Generic tokens for crawling behavior not covered by a specific entry
    const genericBotTokens = ['bot', 'crawler', 'spider', 'scrape', 'headless', 'renderer', 'aiohttp', 'httpx', 'node-fetch', 'httpclient'];

    let bot = null;
    for (const token in knownBots) {
      if (ua.includes(token)) {
        bot = knownBots[token];
        break;
      }
    }
    if (!bot) {
      const generic = genericBotTokens.find(t => ua.includes(t));
      if (generic) bot = ['Unknown', 'other'];
    }

    let isBot = false;
    if (bot) {
      isBot = true;
      // Payload: category + raw user-agent (truncated) for richer segmentation
      send_nca_event('visitor.bot.' + bot[0], bot[1] + '|' + ua.slice(0, 120));
    } else if (navigator.webdriver) {
      isBot = true;
      send_nca_event('visitor.bot.Headless');
    } else {
      send_nca_event('visitor.human');
    }

    // Report 30s of engagement (single fire; not tied to consent decision).
    // Bots/crawlers are excluded - they do not "engage".
    setTimeout(() => {
      if (!isBot) send_nca_event('engaged.30s');
    }, 30000);

    // Interaction heuristic: after 6s, report whether any human-like
    // interaction (scroll, pointer, key, click) was observed. Separates
    // passive loads (fast bots, bounces) from engaged visits.
    let interacted = false;
    const markInteracted = () => { interacted = true; };
    ['scroll', 'pointerdown', 'mousemove', 'keydown', 'click'].forEach(evt =>
      window.addEventListener(evt, markInteracted, { passive: true, once: true })
    );
    setTimeout(() => {
      if (!isBot) send_nca_event(interacted ? 'visit.active' : 'visit.passive');
    }, 6000);

    if (acceptBtn) {
      acceptBtn.addEventListener("click", event => {
        event.preventDefault();
        safeStorageSet(consentKey, "granted");
        banner.style.display = "none";
        send_nca_event("cookie-consent-accepted");
        loadGA();
      });
    }

    if (rejectBtn) {
      rejectBtn.addEventListener("click", event => {
        event.preventDefault();
        safeStorageSet(consentKey, "denied");
        banner.style.display = "none";
        send_nca_event("cookie-consent-rejected");
        disableGA();
      });
    }

    if (withdrawBtn) {
      withdrawBtn.addEventListener("click", event => {
        event.preventDefault();
        disableGA();
        safeStorageRemove(consentKey);
        banner.style.display = "block";
        send_nca_event("cookie-consent-withdrawn");
        debugLog("GA consent withdrawn by user.");
      });
    }
  });
</script>
