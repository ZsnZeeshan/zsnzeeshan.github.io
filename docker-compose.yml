services:
  jekyll:
    image: jekyll/jekyll:latest
    container_name: jekyll
    command: jekyll serve --watch --force_polling --host 0.0.0.0
    ports:
      - "4000:4000"
    volumes:
      - ./:/srv/jekyll

  cibuild:
    image: jekyll/jekyll:latest
    container_name: cibuild
    working_dir: /srv/jekyll
    volumes:
      - ./:/srv/jekyll
    tty: true
    # The bind-mounted repo is owned by the host user, but the image runs
    # bundle exec as the "jekyll" user (uid 1000, HOME=/home/jekyll) via
    # su-exec. Without this, git refuses the repo and the gemspec's
    # `git ls-files` call (used by `gem build`) comes back empty.
    command: bash -c "git config --global --add safe.directory /srv/jekyll && bundle install && ./script/cibuild"
    
